# Safe to commit — no passwords or keystore paths here.
#
# Release signing: copy signing.properties.example → signing.properties
# (signing.properties is gitignored). Place your .keystore under android/ or set storeFile to a path relative to the android/ folder.

# Android
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
