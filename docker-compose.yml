version: "3.8"

# =============================================================================
# Elix Star Live — Docker Compose (Production)
# =============================================================================
#
# Default startup (backwards-compatible):
#   docker compose up -d
#
# With self-hosted LiveKit:
#   docker compose --profile livekit up -d
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core application
  # ---------------------------------------------------------------------------
  elix-star-live:
    build:
      context: .
      args:
        # Frontend URLs — baked in at build so the app connects to your Hetzner server.
        # Set these in .env (e.g. API_URL=https://anberlive.co.uk, VITE_API_URL=..., VITE_WS_URL=...).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_LIVEKIT_URL: ${LIVEKIT_URL:-}
        VITE_BUNNY_CDN_HOSTNAME: ${VITE_BUNNY_CDN_HOSTNAME:-}
        VITE_GIFT_ASSET_BASE_URL: ${VITE_GIFT_ASSET_BASE_URL:-}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgresql://elix:${POSTGRES_PASSWORD:-elix_secret}@postgres:5432/elix_star_live
    volumes:
      - node_modules_cache:/app/node_modules
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal
    depends_on:
      - elix-star-live
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    # Port is exposed only on the internal network — not published to the host
    # Uncomment the next two lines if you need direct host access for debugging:
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: elix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elix_secret}
      POSTGRES_DB: elix_star_live
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elix -d elix_star_live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — used by LiveKit for distributed state (optional)
  # Only starts with:  docker compose --profile livekit up -d
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles:
      - livekit
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # LiveKit — self-hosted WebRTC SFU (optional)
  # Only starts with:  docker compose --profile livekit up -d
  #
  # Required env vars (set in .env):
  #   LIVEKIT_API_KEY
  #   LIVEKIT_API_SECRET
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    profiles:
      - livekit
    ports:
      - "7880:7880" # HTTP / WebSocket
      - "7881:7881" # ICE/TCP
      - "7882:7882/udp" # ICE/UDP
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7880",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks
# =============================================================================
networks:
  internal:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  node_modules_cache:
  postgres_data:
  redis_data:
