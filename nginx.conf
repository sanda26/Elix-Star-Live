# ═══════════════════════════════════════════════════════════════════════════════
# SSL / HTTPS Setup with Let's Encrypt (Certbot)
# ═══════════════════════════════════════════════════════════════════════════════
#
# 1. Replace every occurrence of "server_name _;" below with your actual domain,
#    e.g.  server_name example.com www.example.com;
#
# 2. On first run, start nginx with only the port-80 block active (comment out
#    the port-443 block) so Certbot can reach /.well-known/acme-challenge/.
#
# 3. Obtain certificates with Certbot (standalone or webroot):
#
#      certbot certonly --webroot \
#        -w /var/www/certbot \
#        -d example.com -d www.example.com \
#        --email you@example.com --agree-tos --no-eff-email
#
# 4. Copy (or symlink) the generated certs into the paths referenced below:
#
#      /etc/nginx/certs/fullchain.pem  -> /etc/letsencrypt/live/<domain>/fullchain.pem
#      /etc/nginx/certs/privkey.pem    -> /etc/letsencrypt/live/<domain>/privkey.pem
#
#    Or mount the Let's Encrypt directory into your container if using Docker.
#
# 5. Uncomment the port-443 server block, reload nginx:
#
#      nginx -s reload
#
# 6. Auto-renewal (cron / systemd timer):
#
#      certbot renew --quiet --deploy-hook "nginx -s reload"
#
# ═══════════════════════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/s;

    # ── Large file upload support (videos up to 600 MB) ──────────────────────
    client_max_body_size 600M;
    client_body_timeout 300s;
    client_header_timeout 60s;

    # ── Proxy timeouts (long-running uploads / LiveKit streams) ─────────────
    proxy_connect_timeout  60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # ── Upstream: Hetzner Node/Fastify backend on port 8080 ─────────────────
    upstream anber_backend {
        server elix-star-live:8080;
        keepalive 32;
    }

    # ═════════════════════════════════════════════════════════════════════════
    # HTTP (port 80) — redirect everything to HTTPS except ACME challenges
    # ═════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt / Certbot domain verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other HTTP traffic to HTTPS (permanent)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═════════════════════════════════════════════════════════════════════════
    # HTTPS (port 443) — main application server
    # ═════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── SSL certificate paths (Let's Encrypt / Certbot) ─────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ── Modern TLS settings ─────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # ── SSL session caching ─────────────────────────────────────────────
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── OCSP stapling ───────────────────────────────────────────────────
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

        # ── Login endpoint — strict rate limit ───────────────────────────────
        location /api/auth/login {
            limit_req zone=login burst=50 nodelay;

            proxy_pass         http://anber_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Video upload endpoint — relaxed rate limit + large body ──────────
        location /api/media/upload-file {
            limit_req zone=upload burst=50 nodelay;

            # Per-location body size override (inherits global 600M)
            client_max_body_size 600M;
            client_body_timeout  300s;

            proxy_pass         http://anber_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Disable request buffering so large files stream straight through
            # to the backend instead of being buffered on disk by nginx first.
            proxy_request_buffering off;
            proxy_buffering         off;
        }

        # ── WebSocket — LiveKit signalling & Hetzner WS (live rooms) ─────────
        location /live/ {
            proxy_pass         http://anber_backend;
            proxy_http_version 1.1;

            # Required WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep WebSocket connections alive
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── General API — standard rate limit ────────────────────────────────
        location /api/ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass         http://anber_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Static assets — long cache headers ───────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://anber_backend;
            expires 1y;
            add_header Cache-Control            "public, immutable";
            add_header X-Frame-Options          "SAMEORIGIN"        always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # ── Everything else — proxy to Hetzner backend ───────────────────────
        location / {
            proxy_pass         http://anber_backend;
            proxy_http_version 1.1;

            # Pass WebSocket upgrade if present (catches any WS paths not
            # matched by /live/ above, e.g. hot-reload in dev)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
